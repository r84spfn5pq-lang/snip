<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wordmark">SNIP<span class="dot">.</span></div>
  <p class="tagline">Paste a long link. Get a short one back.</p>
  <button id="logout-btn" class="logout-btn" type="button" hidden>Log out</button>
</header>

<main>
  <section id="auth-section" class="auth-section">
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login">Log in</button>
      <button type="button" class="auth-tab" data-tab="signup">Sign up</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>

    <form id="signup-form" class="auth-form" hidden>
      <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      <input type="password" name="password" placeholder="Password (8+ characters)" required autocomplete="new-password">
      <button type="submit">Create account</button>
    </form>

    <p id="auth-error" class="form-error" hidden></p>
  </section>

  <section id="app-section" class="app-section" hidden>
    <form id="create-form" class="create-form">
      <input
        type="url"
        id="url-input"
        name="url"
        placeholder="https://example.com/a-very-long-url-goes-here"
        required
        autocomplete="off"
      >
      <button type="submit">Shorten</button>
    </form>
    <p id="form-error" class="form-error" hidden></p>

    <section class="ticket-rack" id="ticket-rack" aria-live="polite">
      <p class="empty-state" id="empty-state">No links yet — shorten your first one above.</p>
    </section>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
